name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: https://cvwxcgwoenibxqdtncec.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          echo "Pinging Supabase database..."

          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          curl -sS -f \
            "${SUPABASE_URL}/rest/v1/supawake_0b781007?select=*&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"

          echo ""
          echo "Supabase database query completed successfully."
